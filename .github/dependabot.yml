# Atualizações automáticas semanais. Minor e patch vêm AGRUPADOS num PR só;
# major vem em PR próprio, porque costuma quebrar. Nada entra sozinho:
# todo PR passa pelo preview da Vercel e espera merge manual.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Fortaleza
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      npm-minor-e-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Fortaleza
    commit-message:
      prefix: chore(ci)
    groups:
      actions-minor-e-patch:
        update-types: [minor, patch]
